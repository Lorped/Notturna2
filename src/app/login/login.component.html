<div>
  &nbsp;
</div>
<mat-card >

  <mat-card-title>
    <span class="true-primary"><h1>NOTTURNA</h1></span>
  </mat-card-title>
  <mat-card-subtitle>
    <span class="true-primary-small"><h2>Young Blood</h2></span>
  </mat-card-subtitle>


  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="doLogin()" #formDir="ngForm">

      <mat-form-field class="full">
        <input matInput formControlName="nome" placeholder="Nome utente" required>
      </mat-form-field>

      <mat-form-field class="full">
        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="Password" required >
        <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility($event)" [attr.aria-label]="hide ? 'Mostra password' : 'Nascondi password'" [attr.aria-pressed]="hide">
          <mat-icon class="white">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <button  mat-raised-button class="large" color="primary" [disabled]="!formDir.form.valid" >Login</button>
      <div style="text-align:center">
        <p>
          <a [routerLink]="['/registra']" >Registrati</a>
          @if (loginInvalid) {
            <mat-error>
              Errore di autenticazione
            </mat-error>
          }
        </div>
      </form>
      <div style="color: white;align-self: flex-start;font-size: small;">3.01.03 (Bouvines) </div>
    </mat-card-content>
  </mat-card>
