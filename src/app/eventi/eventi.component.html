<div>
  <p>
    <mat-toolbar>
      <button mat-icon-button class="example-icon" aria-label="menu" (click)="sidenav.toggle()" >
        <mat-icon>menu</mat-icon>
      </button>
      <span style="font-family:delphian; font-size:1.2em;">NOTTURNA</span>
    </mat-toolbar>
  </p>
</div>

<mat-sidenav-container>
  <mat-sidenav class="sidenav" #sidenav mode="side"  >
    <app-sideadm></app-sideadm>
  </mat-sidenav>
  <mat-sidenav-content>


    <div class="container" style="width: 100%; margin: 1em auto 0; min-height: 85vh; display: flex; justify-content: center;">
      <p style="width: 200%;">
        <mat-card>
          <mat-card-title>
            <mat-card-header>
              <span class="bigger">Eventi</span>
            </mat-card-header>

            <p></p>
            <mat-chip-listbox aria-label="Cronache"></mat-chip-listbox>
            @for (item of listacronache; track $index) { 
  
                <mat-chip-option (click)="filterByCronaca(item.idcronaca)" [selected]="selectedCronache.includes(item.idcronaca)">
                  <mat-chip color="primary" selected>{{item.descrizione}}</mat-chip>
                </mat-chip-option>

            }
            <p></p>
          </mat-card-title>

          <mat-card-content>
            <div class="columns">
              <div class="column bigger">
                <button type="button" class="sort-btn" (click)="sortBy('nomeplayer')">
                  <span class="sort-label">Giocatore</span>
                  <span class="sort-icon" *ngIf="currentSortColumn === 'nomeplayer'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
              <div class="column bigger">
                <button type="button" class="sort-btn" (click)="sortBy('nomepg')">
                  <span class="sort-label">PG Principale</span>
                  <span class="sort-icon" *ngIf="currentSortColumn === 'nomepg'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
              <div class="column bigger">
                <button type="button" class="sort-btn" (click)="sortBy('Cronaca')">
                  <span class="sort-label">Cronaca Principale</span>
                  <span class="sort-icon" *ngIf="currentSortColumn === 'Cronaca'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
              <!---
              <div class="column bigger">
                <button type="button" class="sort-btn" (click)="sortBy('email')">
                  Email
                  <span *ngIf="currentSortColumn === 'email'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
              -->
              <div class="column bigger is-1">
                <button type="button" class="sort-btn" (click)="sortBy('eventi')">
                  <span class="sort-label">Eventi</span>
                  <span class="sort-icon" *ngIf="currentSortColumn === 'eventi'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
              <div class="column bigger is-1">
                <button type="button" class="sort-btn" (click)="sortBy('xp')">
                  <span class="sort-label">PX</span>
                  <span class="sort-icon" *ngIf="currentSortColumn === 'xp'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
              <div class="column bigger">
                <button type="button" class="sort-btn" (click)="sortBy('eventodata')">
                  <span class="sort-label">Ultimo Evento</span>
                  <span class="sort-icon" *ngIf="currentSortColumn === 'eventodata'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
              <div class="column bigger is-1">
                <button type="button" class="sort-btn" (click)="sortBy('saldo')">
                  <span class="sort-label">Saldo</span>
                  <span class="sort-icon" *ngIf="currentSortColumn === 'saldo'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
                </button>
              </div>
            </div>
            <div class="columns">
              <div class="column">
                <hr>
                </div>
              </div>
              @for (fu of displayedEventi; track fu) {
                <div class="columns">
                  <!--
                  <div class="column">
                    {{fu.idutente}}
                  </div>
                  -->
                  <div class="column ">
                    {{fu.nomeplayer}}
                  </div>
                  <div class="column ">
                    {{fu.nomepg}}
                  </div>
                  <div class="column ">
                    {{fu.Cronaca}}
                  </div>
                  <!---
                  <div class="column ">
                    {{fu.email}}
                  </div>
                  -->
                  <div class="column is-1">
                    {{fu.eventi}}
                  </div>
                  <div class="column is-1">
                    {{fu.xp}}
                  </div>
                  <div class="column ">
                    {{fu.eventodata}}
                  </div>
                  <div class="column is-1">
                    <mat-checkbox (change)="checkpay(fu.idutente)" [checked]="fu.saldo"></mat-checkbox>
                  </div>
                </div>
              }
            </mat-card-content>
          </mat-card>

        </div>



      </mat-sidenav-content>
    </mat-sidenav-container>
